[project]
name = "workflowevals"
version = "0.1.0"
description = "Workflow evaluations with shared decision questions, execution, and scoring."
requires-python = ">=3.13"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
    "anthropic==1.4.0",
    "httpx==0.28.1",
    "huggingface-hub==2.0.0",
    "openai==3.10.0",
    "pyarrow==25.0.1",
    "pydantic==2.13.5",
    "pydantic-ai-slim[anthropic,cerebras,groq,openai]==2.41.0",
    "system-one-adapter==0.2.1",
    "typesafe-sdk==0.7.2",
]

[project.optional-dependencies]
plot = ["matplotlib==3.11.1"]

[tool.uv]
package = false

[tool.ruff]
target-version = "py313"
line-length = 110
